# ClawHub does not ingest from npm, so each release needs an explicit publish.
#
# Separate from publish.yml because ClawHub's trusted publishing only accepts
# workflow_dispatch runs — a push-triggered run is rejected with
# "GitHub OIDC workflow requires workflow_dispatch, got push". Keep this
# workflow's filename in sync with the trusted publisher config:
#   clawhub package trusted-publisher get @honcho-ai/openclaw-honcho
name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish, e.g. v1.5.6"
        required: true
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # clawhub@0.23+ declares engines.node >=22.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # dist/ is gitignored, so the packed folder needs a local build.
      - run: pnpm build

      - name: Publish
        run: |
          npx -y clawhub@latest package publish . \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-ref "${{ inputs.ref }}" \
            --source-commit "${GITHUB_SHA}" \
            --wait --wait-timeout 300 --json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

# ClawHub does not ingest from npm, so each release needs an explicit publish.
#
# Two jobs, because neither half works alone:
#  - dist/ is gitignored, so ClawHub cannot pack this repo from a GitHub source.
#    The build job packs a ClawPack tarball and hands it over as an artifact.
#  - ClawHub's trusted publishing only mints a token for workflow_dispatch runs;
#    a push-triggered run is rejected with
#    "GitHub OIDC workflow requires workflow_dispatch, got push".
#
# The trusted publisher config must name this file:
#   clawhub package trusted-publisher get @honcho-ai/openclaw-honcho
name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish, e.g. v1.5.6"
        required: true
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # clawhub@0.23+ declares engines.node >=22.
          node-version: 22
          cache: pnpm

      # postinstall only prints guidance; skipping it keeps unreviewed
      # install scripts out of the job that builds the published artifact.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Pack the ClawPack tarball
        run: npx -y clawhub@0.23.3 package pack . --pack-destination dist-pack --json

      - uses: actions/upload-artifact@v4
        with:
          name: clawpack
          path: dist-pack/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    # Pinned: this job holds id-token: write, so a mutable @main would give
    # our publishing identity to whatever lands upstream. Bump deliberately.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ff6c118c132ae89b5351739cc45fe9227ff1574e
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      source: ${{ github.repository }}@${{ inputs.ref }}
      package_artifact_name: clawpack
      dry_run: ${{ inputs.dry_run }}

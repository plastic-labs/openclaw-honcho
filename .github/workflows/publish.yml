name: Publish

# npm publishes automatically when package.json changes on main.
# ClawHub is a manual dispatch: it does not ingest from npm, and its trusted
# publishing only mints a token for workflow_dispatch runs — a push-triggered
# run is rejected with "GitHub OIDC workflow requires workflow_dispatch".
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish to ClawHub, e.g. v1.5.6"
        required: true
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: true

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Validate version and ensure it advances npm latest
      - name: Validate package version against npm
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          LATEST_VERSION=$(npm view "@honcho-ai/openclaw-honcho" version 2>/dev/null || echo "")
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          node -e "if(!/^\d+\.\d+\.\d+/.test('$LOCAL_VERSION')){process.exit(1)}" || {
            echo "::error::package.json version \"$LOCAL_VERSION\" is not valid semver"
            exit 1
          }

          if [ -z "$LATEST_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published version found on npm — will publish $LOCAL_VERSION"
            exit 0
          fi

          if node -e "const[a,b]=['$LOCAL_VERSION','$LATEST_VERSION'].map(v=>v.split('.').map(Number));process.exit(a[0]>b[0]||(a[0]===b[0]&&a[1]>b[1])||(a[0]===b[0]&&a[1]===b[1]&&a[2]>b[2])?0:1)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL_VERSION is greater than npm latest $LATEST_VERSION — will publish"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Version $LOCAL_VERSION must be greater than npm latest $LATEST_VERSION"
            exit 1
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        run: |
          VERSION=${{ steps.version-check.outputs.local }}
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

  clawhub:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # No cache here: this job checks out a user-supplied ref, and a cache
      # shared with the default branch would be poisonable from it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Publish to ClawHub
        env:
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # git rev-parse, not GITHUB_SHA: on a dispatch that is the branch head,
          # not the tag actually checked out.
          COMMIT="$(git rev-parse HEAD)"
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="--dry-run"
          npx -y clawhub@0.23.3 package publish . \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-ref "$REF" \
            --source-commit "$COMMIT" \
            --wait --wait-timeout 300 --json $ARGS

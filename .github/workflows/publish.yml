name: Publish

# npm publishes on a package.json change; ClawHub is a workflow_dispatch, because
# its trusted publishing only mints a token for workflow_dispatch runs. ClawHub binds
# that token to the run's OIDC ref and sha claims, so the dispatch has to happen on the
# tag being published: pick it under "Use workflow from". The job checks out that ref.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: true

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Validate version and ensure it advances npm latest
      - name: Validate package version against npm
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          LATEST_VERSION=$(npm view "@honcho-ai/openclaw-honcho" version 2>/dev/null || echo "")
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          node -e "if(!/^\d+\.\d+\.\d+/.test('$LOCAL_VERSION')){process.exit(1)}" || {
            echo "::error::package.json version \"$LOCAL_VERSION\" is not valid semver"
            exit 1
          }

          if [ -z "$LATEST_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No published version found on npm — will publish $LOCAL_VERSION"
            exit 0
          fi

          if node -e "const[a,b]=['$LOCAL_VERSION','$LATEST_VERSION'].map(v=>v.split('.').map(Number));process.exit(a[0]>b[0]||(a[0]===b[0]&&a[1]>b[1])||(a[0]===b[0]&&a[1]===b[1]&&a[2]>b[2])?0:1)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL_VERSION is greater than npm latest $LATEST_VERSION — will publish"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Version $LOCAL_VERSION must be greater than npm latest $LATEST_VERSION"
            exit 1
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        run: |
          VERSION=${{ steps.version-check.outputs.local }}
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Dispatch the ClawHub publish
        if: steps.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version-check.outputs.local }}
        run: |
          # Dispatch on the tag itself so the OIDC ref and sha claims are the tag's;
          # ClawHub rejects a publish whose source ref or commit differ from them.
          gh workflow run publish.yml --ref "v${VERSION}" -f dry_run=false
          echo "Queued a ClawHub publish for v${VERSION}. This only queues a run —"
          echo "check Actions for whether it succeeded."

  clawhub:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checks out the ref the run was dispatched on, which is the only commit ClawHub
      # will accept: it must equal the OIDC token's sha.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # No cache: a tag ref must not write a cache the default branch reads.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # dist/ is gitignored, so the published folder needs a local build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      # Repo and commit are inferred from the checkout. The ref is passed explicitly:
      # the CLI infers a bare tag or branch name, but ClawHub compares it against the
      # OIDC token's fully qualified ref (refs/tags/v1.5.7), and a mismatch is rejected.
      - run: npx -y clawhub@0.23.3 package publish . --source-ref "$GITHUB_REF" --wait --wait-timeout 300 ${{ inputs.dry_run && '--dry-run' || '' }}

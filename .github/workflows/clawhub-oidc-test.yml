# TEMPORARY — delete before merging #143.
#
# Proves ClawHub trusted publishing works from this workflow. Publishing an
# already-published version fails with "Version X already exists", and that
# error only comes back after authentication succeeds — so seeing it is the
# pass condition. Nothing is published.
name: ClawHub OIDC test

on:
  push:
    branches: [ci/clawhub-publish]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Is the OIDC env actually present?
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"

      - name: Mint a publish token directly, to see the real error
        run: |
          set +e
          OIDC=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clawhub" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).value||"")}catch{console.log("")}})')
          if [ -z "$OIDC" ]; then echo "could not obtain an OIDC token"; exit 1; fi
          echo "OIDC token obtained (${#OIDC} chars)"
          echo "--- mint response ---"
          curl -sS -w "\nHTTP %{http_code}\n" -X POST https://clawhub.ai/api/v1/publish/token/mint \
            -H "content-type: application/json" \
            -d "$(node -e 'const t=process.argv[1];console.log(JSON.stringify({packageName:"@honcho-ai/openclaw-honcho",version:"1.5.6",githubOidcToken:t}))' "$OIDC")"

      - name: Attempt publish of the already-published version
        run: |
          set +e
          OUT=$(npx -y clawhub@latest package publish . \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --json 2>&1)
          CODE=$?
          echo "exit=$CODE"
          echo "$OUT"
          echo "---"
          if echo "$OUT" | grep -qi "already exists"; then
            echo "PASS: authenticated via OIDC and reached the version check"
            exit 0
          fi
          if echo "$OUT" | grep -qiE "unauthor|forbidden|not authenticated|no token|login"; then
            echo "FAIL: OIDC authentication rejected"
            exit 1
          fi
          echo "INCONCLUSIVE: unexpected output, inspect above"
          exit 1
